                <main>
  <div class="px-4">
    <h1 class="mt-4">Available IT Assets</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item active">Choose an asset to request assignment</li>
    </ol>

    <div class="row" id="assets-container">
      <!-- Example asset cards -->
      <div class="col-xl-3 col-md-6 mb-4">
        <div class="card h-100 shadow-sm">
          <img src="assets/img/dellpro14.jpg" class="card-img-top" alt="Dell Pro 14" />
          <div class="card-body">
            <h5 class="card-title">Dell Pro 14</h5>
            <p class="card-text text-muted">14" business laptop with Intel i7, 16GB RAM, 512GB SSD</p>
          </div>
          <div class="card-footer bg-transparent border-top-0">
            <button class="btn btn-primary w-100 request-btn" data-asset="Dell Pro 14">
              Request
            </button>
          </div>
        </div>
      </div>

      <div class="col-xl-3 col-md-6 mb-4">
        <div class="card h-100 shadow-sm">
          <img src="assets/img/dellmonitor.jpg" class="card-img-top" alt="Dell 24 Monitor" />
          <div class="card-body">
            <h5 class="card-title">Dell 24 Monitor</h5>
            <p class="card-text text-muted">Full HD 24" monitor with adjustable stand</p>
          </div>
          <div class="card-footer bg-transparent border-top-0">
            <button class="btn btn-primary w-100 request-btn" data-asset="Dell 24 Monitor">
              Request
            </button>
          </div>
        </div>
      </div>

      <!-- Add more cards as needed -->
    </div>
  </div>
</main>
